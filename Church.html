<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Register</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f3;
           margin: 0; padding: 20px; }
    .card { background: white; border-radius: 12px;
            padding: 24px; max-width: 420px;
            margin: 0 auto; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
    p  { font-size: 13px; color: #888; text-align: center; margin: 0 0 20px; }
    label { display: block; font-size: 12px; font-weight: 600;
            color: #555; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px 12px; border-radius: 8px;
                    border: 1px solid #ddd; font-size: 14px;
                    margin-bottom: 14px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #1D9E75;
             color: white; border: none; border-radius: 8px;
             font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #178560; }
    #success { display: none; text-align: center; padding: 20px; }
    #success p { color: #27500A; font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div id="form-section">
      <h1>Kingdom Ways</h1>
      <p>Please fill in your details below</p>

      <label>Full name *</label>
      <input type="text" id="name" placeholder="e.g. Sipho Dlamini">

      <label>Phone number *</label>
      <input type="tel" id="phone" placeholder="e.g. 071 234 5678">

      <label>Email address</label>
      <input type="email" id="email" placeholder="e.g. sipho@email.com">

      <label>Type of visit *</label>
      <select id="visit_type">
        <option value="">Select one...</option>
        <option>First time visitor</option>
        <option>Regular member</option>
        <option>Returning visitor</option>
      </select>

      <button onclick="submitForm()">Sign in</button>
    </div>

    <div id="success">
      <p>Thank you for joining us!</p>
      <p style="font-size:13px;color:#555;font-weight:400">
        Your details have been recorded. God bless you.
      </p>
    </div>
  </div>

  <script>
  async function submitForm() {
    const name       = document.getElementById('name').value
    const phone      = document.getElementById('phone').value
    const email      = document.getElementById('email').value
    const visit_type = document.getElementById('visit_type').value

    if (!name || !phone || !visit_type) {
      alert('Please fill in your name, phone and visit type')
      return
    }

    try {
      // Send to Python server
      const response = await fetch('http://localhost:5000/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone, email, visit_type })
      })

      if (response.ok) {
        // Show thank you message
        document.getElementById('form-section').style.display = 'none'
        document.getElementById('success').style.display = 'block'
      } else {
        alert('Something went wrong. Please try again.')
      }

    } catch (error) {
      alert('Cannot connect to server. Make sure server.py is running.')
    }
  }
</script>

</body>
</html>
