<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — {{ church['name'] }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f3; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; border-radius: 14px; padding: 32px 28px;
            width: 100%; max-width: 380px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .logo { font-size: 28px; text-align: center; margin-bottom: 6px; }
    .logo-img { display: block; width: 80px; height: 80px; border-radius: 50%;
                object-fit: cover; margin: 0 auto 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    h1 { font-size: 18px; text-align: center; color: #1a1a1a; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #888; text-align: center; margin-bottom: 24px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 5px; }
    input { width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid #ddd;
            font-size: 14px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #1D9E75; }
    button { width: 100%; padding: 12px; background: #1a1a1a; color: white;
             border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #333; }
    .error { background: #fff3f3; color: #c0392b; border-radius: 8px;
             padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/static/logo.jpg" alt="Logo" class="logo-img">
    <h1>{{ church['name'] }}</h1>
    <p class="sub">Admin Login</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter admin password" autofocus>
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
