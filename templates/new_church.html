<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Church</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f3; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; border-radius: 14px; padding: 32px 28px;
            width: 100%; max-width: 420px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #888; margin-bottom: 24px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 5px; }
    input { width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid #ddd;
            font-size: 14px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #1D9E75; }
    button { width: 100%; padding: 12px; background: #1D9E75; color: white;
             border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .error   { background: #fff3f3; color: #c0392b; border-radius: 8px;
               padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
    .success { background: #e8f8f1; color: #1D9E75; border-radius: 8px;
               padding: 10px 14px; font-size: 13px; margin-bottom: 16px; font-weight: 600; }
    small { font-size: 11px; color: #aaa; display: block; margin-top: -12px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⛪ Add New Church</h1>
    <p class="sub">Create a new church account. Requires the setup key.</p>

    {% if error %}   <div class="error">{{ error }}</div>   {% endif %}
    {% if success %} <div class="success">{{ success }}</div> {% endif %}

    <form method="POST">
      <label>Church name</label>
      <input type="text" name="name" placeholder="e.g. Grace Community Church" required>

      <label>URL slug</label>
      <input type="text" name="slug" placeholder="e.g. grace-community" required>
      <small>Visitors will go to: yourdomain.com/grace-community</small>

      <label>Admin password</label>
      <input type="password" name="password" placeholder="Choose a strong password" required>

      <label>Setup key</label>
      <input type="password" name="setup_key" placeholder="Your setup key" required>

      <button type="submit">Create church</button>
    </form>
  </div>
</body>
</html>
