<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ church['name'] }} — Visitor Register</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f3; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; border-radius: 14px; padding: 28px 24px;
            width: 100%; max-width: 420px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .logo-wrap { text-align: center; margin-bottom: 12px; }
    .logo-wrap img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
                     box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    h1 { font-size: 22px; text-align: center; color: #1a1a1a; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #888; text-align: center; margin-bottom: 24px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 5px; }
    input, select { width: 100%; padding: 11px 13px; border-radius: 8px;
                    border: 1px solid #ddd; font-size: 14px; margin-bottom: 16px;
                    outline: none; transition: border 0.2s; }
    input:focus, select:focus { border-color: #1D9E75; }
    button { width: 100%; padding: 13px; background: #1D9E75; color: white;
             border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
             cursor: pointer; transition: background 0.2s; }
    button:hover { background: #178560; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #success { display: none; text-align: center; padding: 20px 0; }
    #success .check { font-size: 48px; margin-bottom: 12px; }
    #success h2 { color: #1D9E75; margin-bottom: 8px; }
    #success p { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="form-section">
      <div class="logo-wrap">
        <img src="/static/logo.jpg" alt="{{ church['name'] }} logo">
      </div>
      <h1>{{ church['name'] }}</h1>
      <p class="subtitle">Please fill in your details below</p>

      <label>Full name *</label>
      <input type="text" id="name" placeholder="e.g. Sipho Dlamini" autocomplete="name">

      <label>Phone number *</label>
      <input type="tel" id="phone" placeholder="e.g. 071 234 5678" autocomplete="tel">

      <label>Email address</label>
      <input type="email" id="email" placeholder="e.g. sipho@email.com" autocomplete="email">

      <label>Type of visit *</label>
      <select id="visit_type">
        <option value="">Select one...</option>
        <option>First time visitor</option>
        <option>Regular member</option>
        <option>Returning visitor</option>
      </select>

      <button id="submit-btn" onclick="submitForm()">Sign in</button>
    </div>

    <div id="success">
      <div class="check">✅</div>
      <h2>Thank you for joining us!</h2>
      <p>Your details have been recorded.<br>God bless you.</p>
    </div>
  </div>

  <script>
    async function submitForm() {
      const name       = document.getElementById('name').value.trim()
      const phone      = document.getElementById('phone').value.trim()
      const email      = document.getElementById('email').value.trim()
      const visit_type = document.getElementById('visit_type').value

      if (!name || !phone || !visit_type) {
        alert('Please fill in your name, phone and visit type')
        return
      }

      const btn = document.getElementById('submit-btn')
      btn.disabled = true
      btn.textContent = 'Saving...'

      try {
        const response = await fetch('/{{ church["slug"] }}/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, email, visit_type })
        })
        if (response.ok) {
          document.getElementById('form-section').style.display = 'none'
          document.getElementById('success').style.display = 'block'
        } else {
          const err = await response.json()
          alert(err.error || 'Something went wrong. Please try again.')
          btn.disabled = false
          btn.textContent = 'Sign in'
        }
      } catch (e) {
        alert('Cannot connect to server. Please try again.')
        btn.disabled = false
        btn.textContent = 'Sign in'
      }
    }
  </script>
</body>
</html>
